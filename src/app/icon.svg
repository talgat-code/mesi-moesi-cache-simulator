<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#020810"/>
  <!-- Chip body -->
  <rect x="5" y="5" width="22" height="22" rx="3" fill="#06101e" stroke="#1e3a6e" stroke-width="1"/>
  <!-- Bus lines to center -->
  <line x1="13" y1="13" x2="16" y2="16" stroke="#3b82f6" stroke-width="1.2" opacity="0.85"/>
  <line x1="19" y1="13" x2="16" y2="16" stroke="#a855f7" stroke-width="1.2" opacity="0.85"/>
  <line x1="13" y1="19" x2="16" y2="16" stroke="#06b6d4" stroke-width="1.2" opacity="0.85"/>
  <line x1="19" y1="19" x2="16" y2="16" stroke="#f59e0b" stroke-width="1.2" opacity="0.85"/>
  <!-- Core 0 — blue (top-left) -->
  <rect x="6" y="6" width="7" height="7" rx="1.5" fill="#0d1e48" stroke="#3b82f6" stroke-width="1.1"/>
  <!-- Core 1 — purple (top-right) -->
  <rect x="19" y="6" width="7" height="7" rx="1.5" fill="#1a0d48" stroke="#a855f7" stroke-width="1.1"/>
  <!-- Core 2 — cyan (bottom-left) -->
  <rect x="6" y="19" width="7" height="7" rx="1.5" fill="#042030" stroke="#06b6d4" stroke-width="1.1"/>
  <!-- Core 3 — amber (bottom-right) -->
  <rect x="19" y="19" width="7" height="7" rx="1.5" fill="#201608" stroke="#f59e0b" stroke-width="1.1"/>
  <!-- Central bus node -->
  <circle cx="16" cy="16" r="2.6" fill="#040c1e" stroke="#2563eb" stroke-width="1"/>
  <circle cx="16" cy="16" r="1.3" fill="#3b82f6"/>
</svg>
